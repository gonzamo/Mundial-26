<div class="equipos-container">
    <h1>Selecciones del Mundial 2026</h1>

    <div class="equipos-grid">
        <mat-card *ngFor="let equipo of equipos" class="equipo-card">
            <mat-card-header>
                <mat-card-title>
                    <img src={{equipo.escudoURL}} class="escudo">
                    {{equipo.pais}}
                    </mat-card-title>
            </mat-card-header>
        </mat-card>
    </div>
</div>
